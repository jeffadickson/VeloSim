name: Compiled source differential regression
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/VeloSim.Core/**'
      - 'src/VeloSim.Tools/**'
      - 'tools/VeloSim.Build/**'
      - 'tests/VeloSim.Tests/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'NuGet.config'
      - 'VeloSim.slnx'
      - 'coverage.runsettings'
      - 'native/**'
      - 'examples/**'
      - '.github/workflows/differential.yml'
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install native build dependencies and independent simulators
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++ clang iverilog verilator default-jre-headless uuid-dev zlib1g-dev libssl-dev
      - name: Build pinned upstream compiler using bounded Ninja
        run: |
          cmake -S external/Surelog -B artifacts/surelog -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_INSTALL_PREFIX=$PWD/artifacts/toolchain -DSURELOG_BUILD_TESTS=OFF -DUHDM_BUILD_TESTS=OFF -DSURELOG_WITH_TCMALLOC=OFF
          cmake --build artifacts/surelog --parallel 2
          cmake --install artifacts/surelog
          cmake -S . -B artifacts/with-uhdm -G Ninja -DCMAKE_BUILD_TYPE=Release -DVELOSIM_BUILD_UHDM=ON -DCMAKE_PREFIX_PATH=$PWD/artifacts/toolchain
          cmake --build artifacts/with-uhdm --parallel 4
      - name: Compile C# helpers and native tools
        run: make publish JOBS=4
      - name: Compare actual RTL across three engines and worker configurations
        env:
          VELOSIM_SURELOG: ${{ github.workspace }}/artifacts/toolchain/bin/surelog
          VELOSIM_UHDM_NORMALIZER: ${{ github.workspace }}/artifacts/with-uhdm/bin/velosim-uhdm-normalize
        run: |
          artifacts/publish/VeloSim.Tools/VeloSim.Tools differential --top slang_counter --cycles 1000 --threads 1 --build-jobs 4 --output-dir artifacts/diff-1 examples/slang_counter.sv
          artifacts/publish/VeloSim.Tools/VeloSim.Tools differential --top slang_counter --cycles 1000 --threads 8 --build-jobs 4 --output-dir artifacts/diff-8 examples/slang_counter.sv
          artifacts/publish/VeloSim.Tools/VeloSim.Tools replay artifacts/diff-8/report.json --output-dir artifacts/diff-replay
      - name: Execute actual FIFO, operator and packed selection RTL matrices
        env:
          VELOSIM_REAL_FIFO: '1'
          VELOSIM_SURELOG: ${{ github.workspace }}/artifacts/toolchain/bin/surelog
          VELOSIM_UHDM_RTL: ${{ github.workspace }}/artifacts/with-uhdm/bin/velosim-uhdm-rtl
        run: |
          dotnet test tests/VeloSim.Tests -c Release -m:4 --filter 'FullyQualifiedName~FifoTests|FullyQualifiedName~RtlBitwiseTests|FullyQualifiedName~RtlOperatorTests|FullyQualifiedName~RtlSelectionTests|FullyQualifiedName~ExternalInterfaceTests|FullyQualifiedName~RtlIndexed|FullyQualifiedName~RtlConcat'
          artifacts/publish/VeloSim.Tools/VeloSim.Tools fifo-differential examples/surelog_fifo.sv --top surelog_fifo --output-dir artifacts/fifo-native-cli --workers 1,4,8 --cycles 1000 --build-jobs 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-differential-reports
          path: |
            artifacts/diff-*/
            artifacts/fifo-*/
            artifacts/rtl-bitwise-*/
            artifacts/rtl-operators-*/
            artifacts/rtl-selections-*/
            artifacts/external-interface-*/
            artifacts/rtl-indexed-*/
          if-no-files-found: warn
