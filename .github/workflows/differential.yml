name: Compiled source differential regression
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/VeloSim.Core/**'
      - 'src/VeloSim.Tools/**'
      - 'tools/VeloSim.Build/**'
      - 'tests/VeloSim.Tests/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'NuGet.config'
      - 'VeloSim.slnx'
      - 'coverage.runsettings'
      - 'native/**'
      - 'examples/**'
      - '.github/workflows/differential.yml'
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install native build dependencies and independent simulators
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++ clang iverilog verilator default-jre-headless uuid-dev zlib1g-dev libssl-dev python3-orderedmultidict
      - name: Build pinned upstream compiler using bounded Ninja
        run: |
          cmake -S external/Surelog -B artifacts/surelog -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_INSTALL_PREFIX=$PWD/artifacts/toolchain -DSURELOG_BUILD_TESTS=OFF -DUHDM_BUILD_TESTS=OFF -DSURELOG_WITH_TCMALLOC=OFF
          cmake --build artifacts/surelog --parallel 2
          cmake --install artifacts/surelog
          cmake -S . -B artifacts/with-uhdm -G Ninja -DCMAKE_BUILD_TYPE=Release -DVELOSIM_BUILD_UHDM=ON -DCMAKE_PREFIX_PATH=$PWD/artifacts/toolchain
          cmake --build artifacts/with-uhdm --parallel 4
      - name: Compile C# helpers and native tools
        run: make publish JOBS=4
      - name: Compare actual RTL across three engines and worker configurations
        env:
          VELOSIM_SURELOG: ${{ github.workspace }}/artifacts/toolchain/bin/surelog
          VELOSIM_UHDM_NORMALIZER: ${{ github.workspace }}/artifacts/with-uhdm/bin/velosim-uhdm-normalize
        run: |
          artifacts/publish/VeloSim.Tools/VeloSim.Tools differential --top slang_counter --cycles 1000 --threads 1 --build-jobs 4 --output-dir artifacts/diff-1 examples/slang_counter.sv
          artifacts/publish/VeloSim.Tools/VeloSim.Tools differential --top slang_counter --cycles 1000 --threads 8 --build-jobs 4 --output-dir artifacts/diff-8 examples/slang_counter.sv
          artifacts/publish/VeloSim.Tools/VeloSim.Tools replay artifacts/diff-8/report.json --output-dir artifacts/diff-replay
      - name: Execute actual FIFO, operator and packed selection RTL matrices
        env:
          VELOSIM_REAL_FIFO: '1'
          VELOSIM_SURELOG: ${{ github.workspace }}/artifacts/toolchain/bin/surelog
          VELOSIM_UHDM_RTL: ${{ github.workspace }}/artifacts/with-uhdm/bin/velosim-uhdm-rtl
        run: |
          dotnet test tests/VeloSim.Tests -c Release -m:4 --filter 'FullyQualifiedName~FifoTests|FullyQualifiedName~RtlBitwiseTests|FullyQualifiedName~RtlOperatorTests|FullyQualifiedName~RtlSelectionTests|FullyQualifiedName~ExternalInterfaceTests|FullyQualifiedName~RtlIndexed|FullyQualifiedName~RtlConcat'
          artifacts/publish/VeloSim.Tools/VeloSim.Tools fifo-differential examples/surelog_fifo.sv --top surelog_fifo --output-dir artifacts/fifo-native-cli --workers 1,4,8 --cycles 1000 --build-jobs 4
      - name: Verify pure .NET 11 C# UHDM layer parity against native C++ libuhdm on real Surelog binaries
        env:
          VELOSIM_SURELOG: ${{ github.workspace }}/artifacts/toolchain/bin/surelog
        run: |
          set -euo pipefail
          mkdir -p artifacts/uhdm-net11-parity
          # 1. Counter: inspect + normalize + rtl parity on real Surelog .uhdm
          artifacts/toolchain/bin/surelog -parse -elabuhdm -sverilog -odir artifacts/uhdm-net11-parity/counter_sl -top slang_counter examples/slang_counter.sv
          COUNTER_UHDM=artifacts/uhdm-net11-parity/counter_sl/slpp_all/surelog.uhdm
          artifacts/with-uhdm/bin/velosim-uhdm-inspect "$COUNTER_UHDM" > artifacts/uhdm-net11-parity/counter_cpp_inspect.json
          artifacts/publish/VeloSim.Tools/VeloSim.Tools uhdm-inspect "$COUNTER_UHDM" --output artifacts/uhdm-net11-parity/counter_cs_inspect.json
          diff -u artifacts/uhdm-net11-parity/counter_cpp_inspect.json artifacts/uhdm-net11-parity/counter_cs_inspect.json
          artifacts/with-uhdm/bin/velosim-uhdm-normalize "$COUNTER_UHDM" artifacts/uhdm-net11-parity/counter_cpp_norm.json slang_counter
          artifacts/publish/VeloSim.Tools/VeloSim.Tools uhdm-normalize "$COUNTER_UHDM" --top slang_counter --output artifacts/uhdm-net11-parity/counter_cs_norm.json
          diff -u artifacts/uhdm-net11-parity/counter_cpp_norm.json artifacts/uhdm-net11-parity/counter_cs_norm.json
          artifacts/with-uhdm/bin/velosim-uhdm-rtl "$COUNTER_UHDM" artifacts/uhdm-net11-parity/counter_cpp_rtl.json slang_counter
          artifacts/publish/VeloSim.Tools/VeloSim.Tools uhdm-rtl "$COUNTER_UHDM" --top slang_counter --output artifacts/uhdm-net11-parity/counter_cs_rtl.json
          diff -u artifacts/uhdm-net11-parity/counter_cpp_rtl.json artifacts/uhdm-net11-parity/counter_cs_rtl.json
          # 2. FIFO: inspect + rtl parity on real Surelog .uhdm + full builtin fifo-differential
          artifacts/toolchain/bin/surelog -parse -elabuhdm -sverilog -odir artifacts/uhdm-net11-parity/fifo_sl -top surelog_fifo examples/surelog_fifo.sv
          FIFO_UHDM=artifacts/uhdm-net11-parity/fifo_sl/slpp_all/surelog.uhdm
          artifacts/with-uhdm/bin/velosim-uhdm-inspect "$FIFO_UHDM" > artifacts/uhdm-net11-parity/fifo_cpp_inspect.json
          artifacts/publish/VeloSim.Tools/VeloSim.Tools uhdm-inspect "$FIFO_UHDM" --output artifacts/uhdm-net11-parity/fifo_cs_inspect.json
          diff -u artifacts/uhdm-net11-parity/fifo_cpp_inspect.json artifacts/uhdm-net11-parity/fifo_cs_inspect.json
          artifacts/with-uhdm/bin/velosim-uhdm-rtl "$FIFO_UHDM" artifacts/uhdm-net11-parity/fifo_cpp_rtl.json surelog_fifo
          artifacts/publish/VeloSim.Tools/VeloSim.Tools uhdm-rtl "$FIFO_UHDM" --top surelog_fifo --output artifacts/uhdm-net11-parity/fifo_cs_rtl.json
          diff -u artifacts/uhdm-net11-parity/fifo_cpp_rtl.json artifacts/uhdm-net11-parity/fifo_cs_rtl.json
          # 3. Additional real-Surelog structural designs: bitwise, selections, FIFO operators & selections
          for spec in \
            "bitwise:surelog_bitwise:examples/surelog_bitwise.sv" \
            "selections:surelog_selections:examples/surelog_selections.sv" \
            "fifo_ops:surelog_fifo_ops:examples/surelog_fifo_operators.sv" \
            "fifo_sel:surelog_fifo_selections:examples/surelog_fifo_selections.sv"; do
            IFS=: read -r tag top sv <<< "$spec"
            artifacts/toolchain/bin/surelog -parse -elabuhdm -sverilog -odir "artifacts/uhdm-net11-parity/${tag}_sl" -top "$top" "$sv"
            UHDM_BIN="artifacts/uhdm-net11-parity/${tag}_sl/slpp_all/surelog.uhdm"
            artifacts/with-uhdm/bin/velosim-uhdm-inspect "$UHDM_BIN" > "artifacts/uhdm-net11-parity/${tag}_cpp_inspect.json"
            artifacts/publish/VeloSim.Tools/VeloSim.Tools uhdm-inspect "$UHDM_BIN" --output "artifacts/uhdm-net11-parity/${tag}_cs_inspect.json"
            diff -u "artifacts/uhdm-net11-parity/${tag}_cpp_inspect.json" "artifacts/uhdm-net11-parity/${tag}_cs_inspect.json"
            artifacts/with-uhdm/bin/velosim-uhdm-rtl "$UHDM_BIN" "artifacts/uhdm-net11-parity/${tag}_cpp_rtl.json" "$top"
            artifacts/publish/VeloSim.Tools/VeloSim.Tools uhdm-rtl "$UHDM_BIN" --top "$top" --output "artifacts/uhdm-net11-parity/${tag}_cs_rtl.json"
            diff -u "artifacts/uhdm-net11-parity/${tag}_cpp_rtl.json" "artifacts/uhdm-net11-parity/${tag}_cs_rtl.json"
          done
          artifacts/publish/VeloSim.Tools/VeloSim.Tools differential --top slang_counter --cycles 1000 --threads 1 --build-jobs 4 --normalizer builtin --output-dir artifacts/diff-net11-builtin examples/slang_counter.sv
          artifacts/publish/VeloSim.Tools/VeloSim.Tools replay artifacts/diff-net11-builtin/report.json --output-dir artifacts/diff-net11-builtin-replay
          artifacts/publish/VeloSim.Tools/VeloSim.Tools fifo-differential examples/surelog_fifo.sv --top surelog_fifo --exporter builtin --output-dir artifacts/fifo-net11-builtin --workers 1,4 --cycles 1000 --build-jobs 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-differential-reports
          path: |
            artifacts/diff-*/
            artifacts/fifo-*/
            artifacts/rtl-bitwise-*/
            artifacts/rtl-operators-*/
            artifacts/rtl-selections-*/
            artifacts/external-interface-*/
            artifacts/rtl-indexed-*/
          if-no-files-found: warn
